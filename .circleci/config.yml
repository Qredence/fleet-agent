version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:24.19.0
    working_directory: ~/fleet-agent

  python:
    docker:
      - image: cimg/python:3.13
    working_directory: ~/fleet-agent

commands:
  install-pnpm:
    steps:
      - run:
          name: Install pnpm
          command: |
            sudo npm install --global pnpm@11.15.1
            pnpm config set store-dir ~/.cache/pnpm
            pnpm --version

  install-uv:
    steps:
      - run:
          name: Install uv
          command: |
            python -m pip install --user uv==0.12.21
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            uv --version

jobs:
  web:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - v1-pnpm-
      - install-pnpm
      - run:
          name: Install workspace dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/pnpm
      - run:
          name: Audit web dependencies
          command: pnpm audit --audit-level=high
      - run:
          name: Lint web
          command: pnpm --filter web lint
      - run:
          name: Test web
          command: pnpm --filter web test
      - run:
          name: Build web
          command: pnpm --filter web build

  api:
    docker:
      - image: cimg/python:3.13
      - image: postgres:17-alpine
        environment:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet_agent
    working_directory: ~/fleet-agent
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-uv-{{ checksum "apps/api/uv.lock" }}
            - v1-uv-
      - install-uv
      - run:
          name: Install API dependencies
          command: cd apps/api && uv sync --locked --all-groups
      - save_cache:
          key: v1-uv-{{ checksum "apps/api/uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Audit API dependencies
          # Dependabot reads the GitHub advisory DB; pip-audit reads PyPI/OSV.
          # They disagree, so this gate is deliberately independent. Accepted
          # risk: PYSEC-2026-2447 (diskcache pickle deserialization, requiring
          # local write access to the cache directory). diskcache is still a
          # direct dependency of dspy (3.5.0 requires diskcache>=5.6.0) and
          # 5.6.3 is the newest release, so no fixed version exists to upgrade
          # to. Drop the ignore once upstream publishes a fix.
          command: |
            cd apps/api
            req_file=$(mktemp)
            trap 'rm -f "$req_file"' EXIT
            uv export --frozen --no-emit-project --no-hashes --format requirements-txt > "$req_file"
            uvx pip-audit==2.10.1 -r "$req_file" --ignore-vuln PYSEC-2026-2447
      - run:
          name: Wait for and initialize test database
          command: |
            cd apps/api
            uv run python -c '
            import asyncio
            import asyncpg

            async def main():
                for attempt in range(30):
                    try:
                        conn = await asyncpg.connect("postgresql://fleet:fleet@localhost:5432/postgres")
                        try:
                            exists = await conn.fetchval(
                                "SELECT 1 FROM pg_database WHERE datname = $1",
                                "fleet_agent_test",
                            )
                            if not exists:
                                await conn.execute("CREATE DATABASE fleet_agent_test")
                        finally:
                            await conn.close()
                        return
                    except (OSError, asyncpg.PostgresError):
                        if attempt == 29:
                            raise
                        await asyncio.sleep(2)

            asyncio.run(main())
            '
      - run:
          name: Ruff lint
          command: cd apps/api && uv run ruff check .
      - run:
          name: Ruff format check
          command: cd apps/api && uv run ruff format --check .
      - run:
          name: Mypy
          command: cd apps/api && uv run mypy app
      - run:
          name: Dependency declarations
          command: cd apps/api && uv run deptry .
      - run:
          name: Run migrations
          command: >-
            cd apps/api &&
            FLEET_AGENT_DATABASE_URL=postgresql+asyncpg://fleet:fleet@localhost:5432/fleet_agent_test
            uv run alembic upgrade head
      - run:
          name: Test API
          command: >-
            cd apps/api &&
            FLEET_AGENT_TEST_DATABASE_URL=postgresql+asyncpg://fleet:fleet@localhost:5432/fleet_agent_test
            uv run pytest
      - run:
          name: Boot smoke (the server must actually start and answer)
          command: |
            # In-process TestClient runs never prove the app BOOTS. A bad tracking
            # URI or an unreachable database used to make startup fail outright,
            # while every test stayed green. This boots a real uvicorn and asserts
            # the surfaces an operator depends on.
            cd apps/api
            export FLEET_AGENT_DATABASE_URL=postgresql+asyncpg://fleet:fleet@localhost:5432/fleet_agent_test
            export FLEET_AGENT_AGENT_MODE=engine
            export FLEET_AGENT_API_KEY=ci-smoke-key
            export FLEET_AGENT_MLFLOW_TRACING_ENABLED=true
            export FLEET_AGENT_MLFLOW_TRACKING_URI=sqlite:////tmp/ci-mlflow.db
            uv run uvicorn app.main:app --host 127.0.0.1 --port 8123 --log-level warning &
            server_pid=$!
            trap 'kill $server_pid 2>/dev/null || true' EXIT
            for _ in $(seq 1 40); do
              curl -fsS http://127.0.0.1:8123/health > /dev/null 2>&1 && break
              sleep 0.5
            done
            curl -fsS http://127.0.0.1:8123/health
            # /ready answers 200 or 503, never hangs or 500s.
            ready=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/ready)
            test "$ready" = "200" || test "$ready" = "503"
            # Un-prefixed routes are protected when a key is configured.
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/metrics)" = "401"
            test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-api-key: ci-smoke-key' http://127.0.0.1:8123/metrics)" = "200"
            # The public liveness probe must stay open.
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/health)" = "200"

  contracts:
    executor: python
    steps:
      - checkout
      - install-uv
      - run:
          name: Validate contract JSON schemas
          command: |
            uv run --no-project --with jsonschema==4.26.0 python -c '
            import json
            from pathlib import Path
            import jsonschema

            schemas = sorted(Path("packages/contracts").glob("*.schema.json"))
            assert len(schemas) == 5, f"Expected 5 schemas, found {len(schemas)}"
            for path in schemas:
                with path.open() as schema_file:
                    schema = json.load(schema_file)
                jsonschema.Draft202012Validator.check_schema(schema)
                print(f"{path.name}: OK")
            '
      - run:
          name: Verify Python contract codegen freshness
          command: |
            uv run --no-project --with datamodel-code-generator==0.96.0 --with ruff==0.17.5 python -c '
            import difflib
            import subprocess
            import sys
            from pathlib import Path

            specs = [
                ("agent-workspace-state.schema.json", "app/contracts/agent_state.py", True, False),
                ("thread-bootstrap.schema.json", "app/contracts/thread_bootstrap.py", True, False),
                ("agent-capabilities.schema.json", "app/contracts/agent_capabilities.py", True, True),
                ("inline-card.schema.json", "app/contracts/inline_card.py", False, True),
                ("message-feedback.schema.json", "app/contracts/message_feedback.py", False, True),
            ]
            api_dir = Path("apps/api")
            for schema_name, out_rel, use_title, enum_literal in specs:
                cmd = [
                    "datamodel-codegen",
                    "--input", f"../../packages/contracts/{schema_name}",
                    "--input-file-type", "jsonschema",
                    "--output-model-type", "pydantic_v2.BaseModel",
                    "--target-python-version", "3.13",
                    "--use-union-operator",
                    *(["--use-title-as-name"] if use_title else []),
                    *(["--enum-field-as-literal", "all"] if enum_literal else []),
                    "--disable-timestamp",
                    "--formatters", "ruff-check", "ruff-format",
                ]
                proc = subprocess.run(cmd, cwd=api_dir, check=True, capture_output=True, text=True)
                actual = (api_dir / out_rel).read_text(encoding="utf-8")
                if proc.stdout != actual:
                    diff = "".join(difflib.unified_diff(
                        actual.splitlines(True),
                        proc.stdout.splitlines(True),
                        fromfile=f"apps/api/{out_rel}",
                        tofile=f"{schema_name} (generated)",
                    ))
                    print(diff, file=sys.stderr)
                    sys.exit(1)
                print(f"apps/api/{out_rel}: fresh")
            '

  ci-success:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Confirm all CI jobs passed
          command: echo "All CircleCI validation jobs passed."

workflows:
  ci:
    jobs:
      - web
      - api
      - contracts
      - ci-success:
          requires:
            - web
            - api
            - contracts
