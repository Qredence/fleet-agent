project: Fleet Agent
platform: github
imagemagick: true
video_evidence: true
# Record each browser flow as WebM (one per flow, <=60s) under
# ./qa-results/$RUN_ID/. CI uploads (GitHub user-attachments) are disabled
# because no CI workflow was requested; locally, reference the files in the
# report's evidence section instead of embedding remote URLs.

environments:
  local-dev-fixtures:
    url: http://localhost:5173
    restrictions:
      - Default API mode is fixtures (deterministic, provider-free)
      - Dev PostgreSQL (fleet_agent DB, not fleet_agent_test) holds QA rows
  local-dev-engine:
    url: http://localhost:5173
    restrictions:
      - Requires FLEET_AGENT_AGENT_MODE=engine in apps/api/.env
      - Requires an LLM key (MODAL_* trio or FLEET_AGENT_LLM_*) in apps/api/.env
      - Never print or copy keys from .env into reports

default_target: local-dev-fixtures

auth:
  method: none
  provider: none
  # No user authentication exists. OpenRouter OAuth in the settings dialog is
  # BYOK LLM key management (browser localStorage), not app login.
  # Optional shared gate: FLEET_AGENT_API_KEY (API) / VITE_API_KEY (web) -> X-API-Key.

personas:
  - name: anonymous-local-user
    description: 'Single unauthenticated local user; the app has no roles or accounts'
    credentials_source: none
    test_focus:
      - project/thread lifecycle
      - fixtures chat runs
      - settings providers dialog
      - engine flows when a key is available
    cannot_do: []

apps:
  web:
    path_patterns: ['apps/web/**', 'packages/contracts/**']
    skill: qa-web
    test_tool: agent-browser
  api:
    path_patterns: ['apps/api/**', 'packages/contracts/**', 'compose.yaml']
    skill: qa-api
    test_tool: curl

feature_flags:
  provider: none
  dashboard_url: null
  how_to_override: >-
    No flag service. Behavior toggles are env-driven (apps/api/.env):
    FLEET_AGENT_AGENT_MODE=fixtures|engine, FLEET_AGENT_REASONING_PROGRAM,
    FLEET_AGENT_WORKSPACE_*_ENABLED, FLEET_AGENT_FLEX_ENABLED. QA reads
    (never prints) .env to know the active mode.

integrations:
  llm_gateway:
    provider: openai-compatible
    config: >-
      Engine mode resolves: browser BYOK profile (X-LLM-* headers) >
      MODAL_API_KEY/MODAL_BASE_URL/MODAL_MODEL_ID > FLEET_AGENT_LLM_*.
      Credentials live in apps/api/.env (local only, never committed).
  web_search:
    provider: tavily
    config: >-
      FLEET_AGENT_TAVILY_API_KEY in apps/api/.env enables web_search and
      fetch_page tools. Key is available locally; include web-search flows
      in engine mode; never print the key.

cleanup:
  auto_cleanup: true
  strategy: api-call
  instructions: >-
    After each run, delete every QA-created project via
    DELETE http://localhost:8000/api/projects/{project_id} (cascades its
    threads). Track created project ids in ./qa-results/$RUN_ID/created.txt
    and clean up even on failure. Never delete pre-existing projects.

failure_learning: suggest_in_report
