# The code capability: understand once, then loop change-verify until the
# suite is green or the budget is spent. The driver loop lives in
# app/agent/code.py because "did the tests pass?" is a computed condition,
# not a field mapping - same boundary as FleetAgent's routing conditional.
#
#   understand (predict) -> [change (react) -> test command]* -> answer (predict)

agent: code
root: answer
version: 1
policy_file: prompts/policy.md

signatures:
  - name: Understand
    instructions_file: prompts/code_understand.md
    inputs:
      - name: user_request
        type: str
        description: The coding task.
    outputs:
      - name: plan
        type: str
        description: The smallest change that fixes the request.
      - name: files_to_touch
        type: list[str]
        description: Files the change is expected to touch.

  - name: Change
    instructions_file: prompts/code_change.md
    inherit_policy: true
    inputs:
      - name: user_request
        type: str
        description: The coding task.
      - name: plan
        type: str
        description: The agreed change plan.
      - name: previous_failure
        type: str
        description: Test output from the last failed attempt, or empty.
    # No output fields by design, same as the evidence loop: the loop ends when
    # the model stops asking for tools, and verification happens outside it.
    outputs: []

  - name: Answer
    instructions_file: prompts/code_answer.md
    inherit_policy: true
    inputs:
      - name: user_request
        type: str
        description: The coding task.
      - name: test_result
        type: str
        description: Final test outcome, pass or fail with summary.
    outputs:
      - name: answer
        type: str
        description: What was done and whether the tests pass.
      - name: process_summary
        type: str
        description: Concise account of the attempts made.
      - name: key_decisions
        type: list[str]
        description: Important decisions made.
      - name: caveats
        type: list[str]
        description: Remaining uncertainty or limitations.

modules:
  understand:
    type: predict
    signature: Understand

  change:
    type: react
    signature: Change
    # Replaced per run with the run's tool set. The schema requires a react
    # node to bind at least one tool, and this list is the honest floor.
    tools:
      - read
    max_iters: 6

  answer:
    type: predict
    signature: Answer
