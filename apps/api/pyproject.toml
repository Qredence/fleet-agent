[project]
name = "fleet-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-protocol>=1.0.0",
    "alembic>=1.20.0",
    "anyio>=4.15.1",
    "asyncpg>=0.31.0",
    "dspy==3.4.0",
    "fastapi>=0.142.1",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "mlflow==3.16.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.1",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "deptry>=0.25.1",
    "fastapi-cli>=0.0.32",
    "jsonpatch>=1.33",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-PyYAML>=6.0.12.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "TID252"]

# app/contracts/ holds generated models (agent_state.py, thread_bootstrap.py)
# plus the small authored loaders that read packages/contracts at runtime.
[tool.ruff.lint.per-file-ignores]
"app/contracts/**" = ["E501"]
# pathlib/polling in tests are infra details, not the road.
"tests/**" = ["ASYNC240", "ASYNC110"]

[tool.mypy]
strict = true
mypy_path = "."
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "ag_ui.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dspy.*"
ignore_missing_imports = true

# Generated from packages/contracts/*.schema.json — not authored code.
[[tool.mypy.overrides]]
module = ["app.contracts.agent_state", "app.contracts.thread_bootstrap"]
ignore_errors = true

[tool.deptry]
# Evaluation workspaces contain sample imports, not backend dependencies.
extend_exclude = ["evals/fixtures"]

[tool.deptry.per_rule_ignores]
# Loaded by SQLAlchemy's URL and the deployment/dev CLI respectively.
DEP002 = ["asyncpg", "uvicorn"]
